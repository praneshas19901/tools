<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Progress Timers</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#e9eefe 0,transparent 55%),#f6f7fb}.shell{width:min(880px,calc(100% - 36px));margin:0 auto;padding:54px 0 76px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:#777f94}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:9px 0 28px}.heading h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.055em;line-height:1;margin:0;color:#171d30}.heading p{margin:10px 0 0;color:#7b8293;font-size:14px}.new-btn,.action{font:inherit;border:0;cursor:pointer;transition:transform .16s,background .16s}.new-btn{background:#5865e8;color:white;border-radius:12px;padding:12px 17px;font-size:14px;font-weight:700;box-shadow:0 5px 14px #5865e833;white-space:nowrap}.new-btn:hover{background:#4855d3;transform:translateY(-1px)}.list{display:grid;gap:13px}.empty{border:1px dashed #d6d9e4;border-radius:17px;padding:52px 24px;text-align:center;color:#81889a;background:#ffffff9c}.empty strong{display:block;color:#32394e;font-size:16px;margin-bottom:8px}.card{--accent:#6171eb;background:white;border:1px solid #e8eaf1;border-radius:17px;padding:20px 21px 18px;box-shadow:0 5px 20px #212b4408;transition:box-shadow .2s,transform .2s;position:relative}.card.dragging{opacity:.45}.card.over{box-shadow:0 0 0 2px var(--accent),0 8px 24px #212b4414;transform:translateY(-2px)}.top{display:flex;align-items:center;gap:11px}.grip{color:#b0b5c3;cursor:grab;font-size:16px;user-select:none;touch-action:none}.name{font-weight:720;color:#232a3c;font-size:16px;min-width:0;overflow-wrap:anywhere;flex:1}.tag{border-radius:20px;padding:5px 9px;background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);font-size:11px;font-weight:700;white-space:nowrap}.more{border:0;background:none;color:#9299a8;font-size:18px;padding:3px 7px;cursor:pointer}.progress-head{display:flex;justify-content:space-between;align-items:center;margin:21px 0 9px;color:#737b8f;font-size:12px}.clock{font-variant-numeric:tabular-nums;font-size:13px;color:#535b6e;font-weight:650}.track{height:9px;border-radius:10px;background:#eef0f5;overflow:hidden}.fill{height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .35s linear}.bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.controls{display:flex;gap:7px}.action{background:#f2f3f7;color:#50586b;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:680}.action:hover{background:#e9ebf2}.action.primary{background:var(--accent);color:white}.action.primary:hover{filter:brightness(.94)}.hint{font-size:11px;color:#a0a5b1}.dialog{border:0;border-radius:18px;padding:0;width:min(430px,calc(100% - 30px));box-shadow:0 24px 80px #10182a33;color:#20273b}.dialog::backdrop{background:#151a2a66;backdrop-filter:blur(3px)}.form{padding:24px}.form h2{margin:0 0 5px;font-size:21px;letter-spacing:-.03em}.form>p{margin:0 0 21px;color:#7d8494;font-size:13px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;font-weight:700;color:#596176}.field input{font:inherit;border:1px solid #e0e3eb;border-radius:10px;padding:11px 12px;outline:none;color:#222a3e}.field input:focus{border-color:#7d87ee;box-shadow:0 0 0 3px #5865e81a}.time-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.unit{position:relative}.unit input{width:100%;padding-right:38px}.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:10px;color:#8b91a0;pointer-events:none}.swatches{display:flex;gap:10px;flex-wrap:wrap}.swatch{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid white;outline:1px solid transparent;cursor:pointer}.swatch:checked{outline-color:#33394a;outline-offset:2px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:23px}.form-actions button{font:inherit;font-size:13px;font-weight:700;padding:10px 14px;border-radius:10px;cursor:pointer;border:0}.cancel{background:#f0f1f5;color:#596176}.submit{background:#5865e8;color:white}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#21283a;color:#fff;border-radius:10px;padding:10px 15px;font-size:12px;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:540px){.shell{padding-top:35px}.heading{align-items:flex-start}.new-btn{padding:10px 12px;font-size:12px}.card{padding:17px}.bottom{align-items:flex-start;flex-direction:column}.controls{width:100%}.action{flex:1}.hint{align-self:flex-end}}
    .delete{color:#d45e68}.delete:hover{background:#fff0f1;color:#b83e49}
    /* Use the timer's selected color across the full card, keeping its contents legible. */
    .card{background:var(--accent);border-color:var(--accent);color:#fff}
    .card .name,.card .clock{color:#fff}
    .card .grip,.card .more,.card .progress-head,.card .hint{color:#ffffffd1}
    .card .tag{background:#ffffff30;color:#fff}
    .card .track{background:#ffffff55}
    .card .fill{background:#fff}
    .card .clock span{color:#ffffffb8!important}
    .card .action{background:#ffffff30;color:#fff}
    .card .action:hover{background:#ffffff48}
    .card .action.primary{background:#fff;color:var(--accent)}
    .card .delete,.card .delete:hover{color:#fff}
    .card .more{font-family:inherit}
    .card.complete-shake{animation:timer-complete-shake 1.8s ease-in-out infinite}
    @keyframes timer-complete-shake{0%,12%,100%{transform:translateX(0)}3%,9%{transform:translateX(-2px) rotate(-.25deg)}6%{transform:translateX(2px) rotate(.25deg)}}
    @media(prefers-reduced-motion:reduce){.card.complete-shake{animation-duration:3s}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="eyebrow">A little progress, every day</div>
    <header class="heading"><div><h1>Progress timers</h1><p>Keep a few goals moving, one timer at a time.</p></div><button class="new-btn" id="addTimer">＋ New timer</button></header>
    <section class="list" id="timerList" aria-live="polite"></section>
  </main>
  <dialog class="dialog" id="timerDialog"><form class="form" id="timerForm"><h2 id="formTitle">Create a timer</h2><p>Give your goal a name and choose a target time.</p><input type="hidden" id="editId"><div class="field"><label for="timerName">Label</label><input id="timerName" maxlength="80" placeholder="e.g. Focus session" required></div><div class="field"><label>Target duration</label><div class="time-inputs"><label class="unit"><input id="hours" type="number" min="0" max="999" value="0" aria-label="Hours"><span>hr</span></label><label class="unit"><input id="minutes" type="number" min="0" max="59" value="25" aria-label="Minutes"><span>min</span></label><label class="unit"><input id="seconds" type="number" min="0" max="59" value="0" aria-label="Seconds"><span>sec</span></label></div></div><fieldset class="field" style="border:0;padding:0;margin:18px 0 0"><legend style="font-size:12px;font-weight:700;color:#596176;margin-bottom:10px">Color</legend><div class="swatches" id="swatches"></div></fieldset><div class="form-actions"><button type="button" class="cancel" id="cancelDialog">Cancel</button><button type="submit" class="submit">Save timer</button></div></form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    (()=>{
      const DB_NAME='progress-timers-db', STORE='timers', colors=['#6171eb','#e46d78','#e29b40','#37a889','#36a6bd','#9b72d5','#e279ad','#78934e','#597da9','#697386'];
      const list=document.getElementById('timerList'), dialog=document.getElementById('timerDialog'), form=document.getElementById('timerForm');
      let db,timers=[],tickHandle,toastHandle,tabFlashHandle,dragId=null,notificationPermission=Promise.resolve();const pendingCompletions=new Set(),baseTitle=document.title,iconLink=document.querySelector('link[rel~="icon"]')||document.head.appendChild(Object.assign(document.createElement('link'),{rel:'icon'})),baseIcon=iconLink.getAttribute('href')||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#6171eb"/><circle cx="32" cy="36" r="20" fill="none" stroke="white" stroke-width="5"/><path d="M24 9h16M32 9v8m0 7v13l9 5" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
      const openDB=()=>new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE))req.result.createObjectStore(STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
      const persist=(timer)=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(timer);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
      const remove=(id)=>new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
      const load=()=>new Promise((resolve,reject)=>{const req=db.transaction(STORE).objectStore(STORE).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});
      const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const elapsed=t=>Math.min(t.duration,Math.max(0,t.elapsed+(t.running?Math.floor((Date.now()-t.startedAt)/1000):0)));
      const fmt=s=>{s=Math.max(0,s|0);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
      function render(){if(!timers.length){list.innerHTML='<div class="empty"><strong>Your timer space is clear.</strong>Create a timer for a focus session, a break, or any goal you want to track.</div>';return}list.innerHTML=timers.map(t=>{const done=elapsed(t),pct=t.duration?Math.min(100,done/t.duration*100):0;return `<article class="card${done>=t.duration?' complete-shake':''}" draggable="true" data-id="${escapeHTML(t.id)}" style="--accent:${t.color}"><div class="top"><span class="grip" title="Drag to reorder" aria-label="Drag to reorder">⠿</span><span class="name">${escapeHTML(t.name)}</span><span class="tag">${t.running?'Running':done>=t.duration?'Complete':'Paused'}</span><button class="more" data-action="edit" title="Edit timer" aria-label="Edit timer">Edit</button><button class="more delete" data-action="delete" title="Delete timer" aria-label="Delete timer">×</button></div><div class="progress-head"><span>${Math.floor(pct)}% complete</span><span class="clock">${fmt(done)} <span style="color:#a0a5b1;font-weight:450">/ ${fmt(t.duration)}</span></span></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(pct)}"><div class="fill" style="width:${pct}%"></div></div><div class="bottom"><div class="controls">${t.running?'<button class="action primary" data-action="pause">Ⅱ Pause</button>':`<button class="action primary" data-action="start" ${done>=t.duration?'disabled':''}>▶ ${done>=t.duration?'Complete':'Start'}</button>`}<button class="action" data-action="stop">■ Stop</button><button class="action" data-action="reset">↺ Reset</button></div><span class="hint">Saved on this device</span></div></article>`}).join('')}
      function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastHandle);toastHandle=setTimeout(()=>el.classList.remove('show'),2200)}
      const flashIcon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e34f5f"/><path d="M24 9h16M32 9v8m15-2 5 5M32 21v14l10 6" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="32" cy="36" r="20" fill="none" stroke="white" stroke-width="5"/></svg>');
      function focusCompletedCard(id){const card=list.querySelector(`[data-id="${CSS.escape(id)}"]`);if(card)card.scrollIntoView({behavior:'smooth',block:'center'})}
      async function notifyCompletion(timer){if(document.hidden)pendingCompletions.add(timer.id);else focusCompletedCard(timer.id);if(!tabFlashHandle){let show=true;tabFlashHandle=setInterval(()=>{document.title=show?'⏰ Timer complete!':baseTitle;iconLink.href=show?flashIcon:baseIcon;show=!show},500)}if('Notification'in window){const permission=Notification.permission==='default'?await notificationPermission:Notification.permission;if(permission==='granted')new Notification('Timer complete: '+timer.name,{body:'Your timer reached 100%.',tag:'timer-complete-'+timer.id})}}
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(tabFlashHandle){clearInterval(tabFlashHandle);tabFlashHandle=null;document.title=baseTitle;iconLink.href=baseIcon}pendingCompletions.forEach(focusCompletedCard);pendingCompletions.clear()}});
      function colorChoices(selected){document.getElementById('swatches').innerHTML=colors.map((c,i)=>`<input class="swatch" type="radio" name="color" value="${c}" aria-label="Color ${i+1}" title="Color ${i+1}" style="background:${c}" ${c===selected?'checked':''} required>`).join('')}
      function openForm(t){form.reset();document.getElementById('editId').value=t?.id||'';document.getElementById('formTitle').textContent=t?'Edit timer':'Create a timer';document.getElementById('timerName').value=t?.name||'';const secs=t?.duration||1500;document.getElementById('hours').value=Math.floor(secs/3600);document.getElementById('minutes').value=Math.floor(secs%3600/60);document.getElementById('seconds').value=secs%60;colorChoices(t?.color||colors[0]);dialog.showModal();if(!t)document.getElementById('timerName').focus()}
      document.getElementById('addTimer').onclick=()=>openForm();document.getElementById('cancelDialog').onclick=()=>dialog.close();
      form.onsubmit=async e=>{e.preventDefault();const id=document.getElementById('editId').value,old=timers.find(t=>t.id===id),duration=(+document.getElementById('hours').value*3600)+(+document.getElementById('minutes').value*60)+(+document.getElementById('seconds').value);if(!duration){toast('Choose a target duration greater than zero.');return}const timer={id:id||crypto.randomUUID(),name:document.getElementById('timerName').value.trim(),duration,elapsed:old?elapsed(old):0,startedAt:old?.startedAt||null,running:old?.running||false,color:form.querySelector('[name=color]:checked').value,order:old?.order??timers.length};if(timer.elapsed>=duration){timer.elapsed=duration;timer.running=false;timer.startedAt=null}try{await persist(timer);timers=timers.filter(t=>t.id!==timer.id);timers.push(timer);timers.sort((a,b)=>a.order-b.order);dialog.close();render()}catch{toast('Could not save this timer. Check browser storage settings.')}};
      list.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const card=btn.closest('.card'),t=timers.find(x=>x.id===card.dataset.id);if(!t)return;switch(btn.dataset.action){case'edit':openForm(t);return;case'delete':if(!confirm('Delete this timer? This cannot be undone.'))return;try{await remove(t.id);timers=timers.filter(x=>x.id!==t.id);render()}catch{toast('Could not delete this timer.')}return;case'start':if('Notification'in window&&Notification.permission==='default')notificationPermission=Notification.requestPermission().catch(()=> 'denied');if(elapsed(t)>=t.duration)return;t.elapsed=elapsed(t);t.startedAt=Date.now();t.running=true;break;case'pause':t.elapsed=elapsed(t);t.startedAt=null;t.running=false;break;case'stop':t.elapsed=elapsed(t);t.startedAt=null;t.running=false;break;case'reset':t.elapsed=0;t.startedAt=null;t.running=false;break}await persist(t);render()});
      list.addEventListener('dragstart',e=>{const card=e.target.closest('.card');if(!card)return;dragId=card.dataset.id;card.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
      list.addEventListener('dragend',e=>{e.target.closest('.card')?.classList.remove('dragging');list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});
      list.addEventListener('dragover',e=>{e.preventDefault();const target=e.target.closest('.card');if(!target||target.dataset.id===dragId)return;list.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));target.classList.add('over')});
      list.addEventListener('drop',async e=>{e.preventDefault();const target=e.target.closest('.card');if(!target||!dragId||target.dataset.id===dragId)return;const from=timers.findIndex(t=>t.id===dragId),to=timers.findIndex(t=>t.id===target.dataset.id),[moved]=timers.splice(from,1);timers.splice(to,0,moved);timers.forEach((t,i)=>{t.order=i});await Promise.all(timers.map(persist));dragId=null;render()});
      async function init(){try{if(!('indexedDB'in window))throw Error();db=await openDB();timers=(await load()).sort((a,b)=>a.order-b.order);render();tickHandle=setInterval(()=>{let changed=false;const completed=[];for(const t of timers)if(t.running&&elapsed(t)>=t.duration){t.elapsed=t.duration;t.running=false;t.startedAt=null;persist(t);completed.push(t);changed=true}if(changed||timers.some(t=>t.running))render();completed.forEach(notifyCompletion)},250)}catch{list.innerHTML='<div class="empty"><strong>Browser storage is unavailable.</strong>Open this page in a browser that supports IndexedDB and allows local site data.</div>'}}
      init();
    })();
  </script>
</body>
</html>
