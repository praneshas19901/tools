name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "api/**"
      - "db/**"
      - "package.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Supabase settings into Calorie Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 -c '
          import os
          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")

          print(f"DEBUG: URL length found: {len(url)}")
          print(f"DEBUG: Key length found: {len(key)}")

          if not url or not key:
            raise ValueError("ERROR: SUPABASE_URL and SUPABASE_ANON_KEY GitHub secrets must be configured.")

          target_files = ["calorietracker-v2.html"]

          for filename in target_files:
            if not os.path.exists(filename):
              print(f"WARNING: {filename} does not exist, skipping.")
              continue

            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()

            if "__SUPABASE_URL__" not in content:
              print(f"WARNING: __SUPABASE_URL__ placeholder not found in {filename}!")
            if "__SUPABASE_ANON_KEY__" not in content:
              print(f"WARNING: __SUPABASE_ANON_KEY__ placeholder not found in {filename}!")

            content = content.replace("__SUPABASE_URL__", url)
            content = content.replace("__SUPABASE_ANON_KEY__", key)

            with open(filename, "w", encoding="utf-8") as f:
              f.write(content)

            print(f"Successfully injected secrets into {filename}")
          '

      - name: Inject project tracker auth and sync endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROJECT_API_URL: ${{ secrets.PROJECT_API_URL }}
        run: |
          python3 -c '
          import os
          replacements = {
            "__SUPABASE_URL__": os.environ.get("SUPABASE_URL", ""),
            "__SUPABASE_ANON_KEY__": os.environ.get("SUPABASE_ANON_KEY", ""),
            "__PROJECT_API_URL__": os.environ.get("PROJECT_API_URL", "")
          }
          filename = "project-tracker.html"
          with open(filename, "r", encoding="utf-8") as f:
            content = f.read()
          for placeholder, value in replacements.items():
            content = content.replace(placeholder, value)
          with open(filename, "w", encoding="utf-8") as f:
            f.write(content)
          print("Injected project tracker configuration")
          '

      - name: Stage All Root HTML Files
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          html_files=(*.html)
          if [ ${#html_files[@]} -eq 0 ]; then
            echo "ERROR: No *.html files found in repository root."
            exit 1
          fi
          cp -v "${html_files[@]}" _site/
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
