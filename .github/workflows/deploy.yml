name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "*.html"
      - "db/**"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Supabase settings into Calorie Tracker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import os

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")
          if not url or not key:
              raise ValueError("SUPABASE_URL and SUPABASE_ANON_KEY GitHub secrets must be configured.")

          filename = "calorietracker-v2.html"
          with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
          content = content.replace("__SUPABASE_URL__", url)
          content = content.replace("__SUPABASE_ANON_KEY__", key)
          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
          print("Injected Supabase settings into Calorie Tracker")
          EOF

      - name: Inject Neon settings into Project Tracker
        env:
          NEON_AUTH_URL: ${{ secrets.NEON_AUTH_URL }}
          NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
        run: |
          python3 - <<'EOF'
          import os

          replacements = {
              "__NEON_AUTH_URL__": os.environ.get("NEON_AUTH_URL", ""),
              "__NEON_DATA_API_URL__": os.environ.get("NEON_DATA_API_URL", ""),
          }
          filename = "project-tracker.html"
          with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
          for placeholder, value in replacements.items():
              content = content.replace(placeholder, value)
          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
          print("Injected Neon settings into Project Tracker")
          EOF

      - name: Stage All Root HTML Files
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          shopt -s nullglob
          html_files=(*.html)
          if [ ${#html_files[@]} -eq 0 ]; then
            echo "ERROR: No *.html files found in repository root."
            exit 1
          fi
          cp -v "${html_files[@]}" _site/
          if [ -d assets ]; then
            cp -Rv assets _site/
          fi
          ls -la _site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
