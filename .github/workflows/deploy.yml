name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug and Inject Supabase Secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 -c '
          import os
          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")

          print(f"DEBUG: URL length found: {len(url)}")
          print(f"DEBUG: Key length found: {len(key)}")

          if not url or not key:
            raise ValueError("ERROR: One or both GitHub secrets are empty or not accessible to this job!")

          target_files = ["calorietracker.html", "calorietracker-v2.html"]

          for filename in target_files:
            if not os.path.exists(filename):
              print(f"WARNING: {filename} does not exist, skipping.")
              continue

            with open(filename, "r", encoding="utf-8") as f:
              content = f.read()
        
            if "__SUPABASE_URL__" not in content:
              print(f"WARNING: __SUPABASE_URL__ placeholder not found in {filename}!")
            if "__SUPABASE_ANON_KEY__" not in content:
              print(f"WARNING: __SUPABASE_ANON_KEY__ placeholder not found in {filename}!")
        
            content = content.replace("__SUPABASE_URL__", url)
            content = content.replace("__SUPABASE_ANON_KEY__", key)
    
            with open(filename, "w", encoding="utf-8") as f:
              f.write(content)
        
            print(f"Successfully injected secrets into {filename}")
          '

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
